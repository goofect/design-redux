# On every push: the simulation tests, then the plugin inside the real Obsidian
# (oldest supported version and latest). Results, screenshots and a
# compatibility report go to the ci-results branch, where they can be read
# without opening Actions. On the default branch, if the simulation tests pass
# and src/ or styles/ changed since the last release, main.js and styles.css are built and
# a new release is published for BRAT: the patch version goes up by one.
# A commit on the default branch with a "Release-As: X.Y.Z" line releases
# that version instead (for a minor or major step), even with no change to src/.
name: Test and release

# Not on pull requests: a branch's own push already runs it. Not for changes
# to the docs, agent notes or agent tools alone. A newer push to a branch cancels its run still going,
# except on the default branch, where each run may release.
on:
  push:
    branches-ignore: [ci-results, ci-snapshots]
    paths-ignore: ['README.md', 'AGENTS.md', 'CLAUDE.md', '.claude/**', 'tests/map.js', 'tests/tool-log.js']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  test:
    runs-on: ubuntu-latest
    # bash with pipefail, so a failure piped through tee still fails the step.
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    outputs:
      unit: ${{ steps.unit.outcome }}
      obsidian: ${{ steps.obsidian.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Built once; both test runs use this main.js.
      - name: Build
        run: node build.mjs

      - name: Simulation tests
        id: unit
        continue-on-error: true
        run: |
          mkdir -p ci-output
          node tests/run.js 2>&1 | tee ci-output/simulation-tests.txt

      # Saved once a week, not on every run: the downloads rarely change, and
      # saving takes as long as restoring. A new Obsidian release mid-week is
      # downloaded until the next week's cache holds it.
      - name: Week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Obsidian downloads
        uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: obsidian-${{ runner.os }}-

      - name: Virtual display
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*.list
          sudo apt-get update -q
          sudo apt-get install -q -y herbstluftwm dzen2 x11-xserver-utils
          export DISPLAY=:99
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          Xvfb $DISPLAY -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 1
          herbstluftwm &

      - name: Tests in Obsidian
        id: obsidian
        continue-on-error: true
        env:
          WDIO_MAX_INSTANCES: 2
        run: npx wdio run ./wdio.conf.mjs 2>&1 | tee ci-output/obsidian-tests.txt

      - name: Publish results to the ci-results branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-output
          {
            echo "commit: $GITHUB_SHA"
            echo "branch: $GITHUB_REF_NAME"
            echo "simulation tests: ${{ steps.unit.outcome }}"
            echo "obsidian tests: ${{ steps.obsidian.outcome }}"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > ci-output/summary.txt
          # The UI snapshots compared with main's last (the ci-snapshots
          # branch): snapshots/diff/summary.txt, and a picture of each change.
          if [ -d ci-output/snapshots ]; then
            mkdir -p /tmp/snapshots-main
            if git fetch -q origin ci-snapshots 2>/dev/null; then
              git archive FETCH_HEAD | tar -x -C /tmp/snapshots-main
              node tools/snapshot-diff.mjs /tmp/snapshots-main ci-output/snapshots --out ci-output/snapshots/diff || true
            fi
            # On main, these become the ones the next runs are compared with.
            if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then
              rm -rf /tmp/snapshots-new && cp -r ci-output/snapshots /tmp/snapshots-new && rm -rf /tmp/snapshots-new/diff
              (cd /tmp/snapshots-new && git init -q && git checkout -q -b ci-snapshots && git add -A \
                && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Snapshots for ${GITHUB_SHA::7}" \
                && git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-snapshots) || true
            fi
          fi
          cd ci-output
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Results for ${GITHUB_SHA::7}"
          # Two runs of one commit (main and a branch kept level with it) can
          # publish at the same moment, and one push loses the race: try again.
          for i in 1 2 3 4; do
            git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results && exit 0
            sleep $((i * 5))
          done
          exit 1

      # The same results kept with the run itself, for two weeks.
      - name: Keep results with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-output
          path: ci-output
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail if any tests failed
        if: steps.unit.outcome != 'success' || steps.obsidian.outcome != 'success'
        run: exit 1

  release:
    needs: test
    # Gated on the simulation tests for now; the Obsidian run is reported but
    # doesn't block until it has proven reliable.
    if: >-
      always() && needs.test.outputs.unit == 'success' &&
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Anything to release?
        id: changed
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          want=$(git log -1 --format=%B | sed -n 's/^Release-As: *\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\) *$/\1/p' | tail -n 1)
          if [ -n "$want" ] && ! git rev-parse -q --verify "refs/tags/$want" >/dev/null; then
            echo "want=$want" >> "$GITHUB_OUTPUT"
            echo "release=yes" >> "$GITHUB_OUTPUT"
          elif [ -z "$last" ] || ! git diff --quiet "$last" HEAD -- src styles styles.css; then
            echo "release=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Version
        if: steps.changed.outputs.release == 'yes'
        id: version
        run: |
          current=$(node -p "require('./manifest.json').version")
          want="${{ steps.changed.outputs.want }}"
          if [ -n "$want" ] && [ "$want" != "$current" ] || git rev-parse -q --verify "refs/tags/$current" >/dev/null; then
            WANT="$want" node -e "
              const fs = require('fs');
              const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
              const [a, b, c] = m.version.split('.').map(Number);
              m.version = process.env.WANT || [a, b, c + 1].join('.');
              fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
              const v = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
              v[m.version] = m.minAppVersion;
              fs.writeFileSync('versions.json', JSON.stringify(v, null, 2) + '\n');
            "
            next=$(node -p "require('./manifest.json').version")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -am "Release $next"
            git push -q origin "HEAD:$GITHUB_REF_NAME"
          else
            next=$current
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

      # The build bundles src/ with esbuild, a dev dependency.
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.release == 'yes'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.changed.outputs.release == 'yes'
        run: npm ci

      - name: Build main.js and styles.css
        if: steps.changed.outputs.release == 'yes'
        run: node build.mjs

      - name: Publish the release
        if: steps.changed.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          # A release made by hand meanwhile (3.0.24 was, and lost its files)
          # gets them attached rather than failing on its tag.
          if gh release view "$v" >/dev/null 2>&1; then
            gh release upload "$v" main.js manifest.json styles.css --clobber
          else
            gh release create "$v" main.js manifest.json styles.css \
              --target "$(git rev-parse HEAD)" --title "$v" --generate-notes ||
              gh release upload "$v" main.js manifest.json styles.css --clobber
          fi
          n=$(gh release view "$v" --json assets -q '.assets | length')
          [ "$n" -ge 3 ] || { echo "::error::release $v has $n of 3 files"; exit 1; }
